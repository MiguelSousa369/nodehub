  <text x="36" y="49" text-anchor="middle" font-family="system-ui, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1"><tspan fill="#ffffff">n</tspan><tspan fill="#5b8ef5">h</tspan></text>
  <text x="84" y="52" font-family="system-ui, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.2"><tspan fill="#e2e8f0">node</tspan><tspan fill="#5b8ef5">hub</tspan></text>
</svg>
