components:
  schemas:
    Machine:
      type: object
      properties:
        host:       { type: string, example: desktop-7f3k2lq, description: Tailnet name (the key; used for SSH and history). }
        displayName: { type: string, example: PC-PEDRO, description: Friendly name for the team; empty if not set. }
        client:     { type: string, nullable: true, example: Silva Bakery }
        sshUser:    { type: string, nullable: true, example: nodehub }
        notes:      { type: string }
        configured: { type: boolean }
        inTailnet:  { type: boolean }
        online:     { type: boolean }
        ip:         { type: string, nullable: true, example: 100.98.12.4 }
        os:         { type: string, nullable: true, example: windows }
        lastSeen:   { type: string, nullable: true, format: date-time }
        lastSessionAt: { type: string, nullable: true, format: date-time, description: Newest helpdesk session on this machine. }
        addedAt:    { type: string, nullable: true, format: date-time, description: When it was configured (or joined the tailnet, if unassigned). The dashboard marks machines added in the last 2 hours as new. }
    MachineConfig:
      type: object
      required: [client]
      properties:
        client:  { type: string, maxLength: 100, description: 'No quotes, ; or $.' }
        displayName: { type: string, maxLength: 60, default: '', description: 'Friendly name, e.g. PC-PEDRO. No quotes, ; or $.' }
        sshUser: { type: string, default: nodehub }
        notes:   { type: string, maxLength: 500, default: '' }
  parameters:
    Host:
      name: host
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,63}$' }

paths:
  /api/machines:
    get:
      summary: List client machines (Tailscale state + configuration)
      responses:
        '200':
          description: Machines, known clients and any Tailscale error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  machines:       { type: array, items: { $ref: '#/components/schemas/Machine' } }
                  clients:        { type: array, items: { type: string } }
                  tailscaleError: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/machines/{host}:
    get:
      summary: Machine configuration, profile and the 10 most recent sessions
      parameters: [{ $ref: '#/components/parameters/Host' }]
      responses:
        '200':
          description: Machine detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:           { type: string }
                  client:         { type: string }
                  sshUser:        { type: string }
                  notes:          { type: string }
                  profile:        { type: string, description: Markdown. }
                  updatedAt:      { type: string, format: date-time }
                  recentSessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
                  totalSessions:  { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: NOT_FOUND (machine not configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      summary: Configure or edit a machine
      description: New machines must be in the tailnet with the client tag (`CLIENT_TAG`).
      parameters: [{ $ref: '#/components/parameters/Host' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineConfig' }
      responses:
        '200':
          description: Saved configuration.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
        '404':
          description: MACHINE_NOT_IN_TAILNET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: TAILSCALE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Remove a machine's configuration
      description: The machine keeps its access; if it is still in the tailnet it shows up as unassigned again.
      parameters: [{ $ref: '#/components/parameters/Host' }]
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/machines/{host}/profile:
    put:
      summary: Replace the machine profile (Markdown)
      parameters: [{ $ref: '#/components/parameters/Host' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { type: string, maxLength: 20000 }
      responses:
        '200': { description: Updated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: MACHINE_NOT_CONFIGURED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/machines/{host}/ssh-test:
    post:
      summary: Test the SSH connection (runs `hostname`)
      description: Only for machines in the tailnet with the client tag (`CLIENT_TAG`).
      parameters: [{ $ref: '#/components/parameters/Host' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sshUser: { type: string, default: nodehub }
      responses:
        '200':
          description: Result of the test.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  kind:    { type: string, enum: [ok, timeout, error] }
                  detail:  { type: string, description: The machine's hostname when ok; OpenSSH's error line otherwise. }
                  message: { type: string, description: English summary. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
        '404':
          description: MACHINE_NOT_IN_TAILNET (only client machines can be tested)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: TAILSCALE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
