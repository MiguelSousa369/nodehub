components:
  schemas:
    PublicKey:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string, example: laptop, description: Label. }
        type:        { type: string, example: ssh-ed25519 }
        comment:     { type: string, example: pedro@PC-PEDRO }
        fingerprint: { type: string, example: 'SHA256:3dPkqMfGz...', description: As ssh-keygen -l shows it. }
        key:         { type: string, description: The full public key line. }
        owner:
          type: object
          nullable: true
          description: The account it belongs to; null for a service key (created by an admin).
          properties:
            id:       { type: integer }
            name:     { type: string }
            username: { type: string }
            active:   { type: boolean }
        effective:   { type: boolean, description: Applied to client PCs (owner active, or service key). }
        createdAt:   { type: string, format: date-time }

paths:
  /api/keys:
    get:
      summary: The team's SSH public keys
      description: |
        Effective keys go into new installers and are applied to client PCs by `nodehub keys sync`
        (run on a technician PC that already has access). Keys of deactivated accounts stay listed
        with `effective: false`. PC tokens may read the list.
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicKey' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Add a key (dashboard session)
      description: |
        Technicians add their own keys (`userId` is ignored). Admins may set `userId` to add a key
        for someone else, or `null` for a service key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, publicKey]
              properties:
                name:      { type: string, maxLength: 60, example: laptop }
                publicKey: { type: string, example: 'ssh-ed25519 AAAAC3Nza... pedro@PC-PEDRO' }
                userId:    { type: integer, nullable: true, description: Admins only. }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicKey' }
        '400':
          description: INVALID_KEY, PRIVATE_KEY (a private key was pasted) or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
        '409':
          description: KEY_EXISTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/keys/{id}:
    delete:
      summary: Remove a key (your own; admins any)
      description: Client PCs stop accepting it after the next `nodehub keys sync`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN (someone else's key) or SESSION_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: KEY_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
