components:
  schemas:
    ConnectedPc:
      type: object
      description: A PC connected with `nodehub login` (its access token, without the secret).
      properties:
        id:         { type: integer }
        name:       { type: string, example: MIGUEL-LAPTOP }
        prefix:     { type: string, example: nhk_4fJ2kQ9x, description: First characters of the token. }
        createdAt:  { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
  responses:
    SessionRequired:
      description: SESSION_REQUIRED (needs a dashboard sign-in, not a PC token)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /api/tokens:
    get:
      summary: Your connected PCs
      description: Requires a dashboard session. PCs are connected through `/api/cli-login`.
      responses:
        '200':
          description: Connected PCs, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConnectedPc' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }

  /api/tokens/{id}:
    delete:
      summary: Disconnect one of your PCs (revokes its token)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
        '404':
          description: NOT_FOUND (or not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
