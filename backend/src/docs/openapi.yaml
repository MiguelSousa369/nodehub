openapi: 3.0.3
info:
  title: nodehub API
  version: 1.0.0
  description: |
    Client machines on the Tailscale network, their configuration (client, SSH user, notes),
    the client installer and the technicians who use the dashboard.
    Sign in with `POST /api/auth/login` and send the token as `Authorization: Bearer <token>`.
    Errors always use `{ error, code, details? }`.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token returned by `POST /api/auth/login`.
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error:   { type: string }
        code:    { type: string, example: VALIDATION_ERROR }
        details: { type: array, items: {} }
  responses:
    Unauthorized:
      description: Not signed in or session expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
