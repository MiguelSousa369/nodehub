components:
  schemas:
    AccessToken:
      type: object
      properties:
        prefix:     { type: string, example: nhk_4fJ2kQ9x, description: First characters, to recognise the token. }
        createdAt:  { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
  responses:
    SessionRequired:
      description: SESSION_REQUIRED (needs a dashboard sign-in, not an access token)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /api/token:
    get:
      summary: Your personal access token (without the secret)
      description: Each user has at most one token. Requires a dashboard session.
      responses:
        '200':
          description: Your token, or `null` if you have none.
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/AccessToken' }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
    post:
      summary: Generate your access token (replaces the previous one)
      description: |
        The token (`nhk_...`) is returned only once. Any PC still using the previous token stops
        working. The token acts as you, except for account-level actions.
      responses:
        '201':
          description: Generated; `token` is shown only now.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AccessToken' }
                  - type: object
                    properties:
                      token: { type: string, example: nhk_... }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
    delete:
      summary: Revoke your access token
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionRequired' }
        '404':
          description: NOT_FOUND (you have no token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
