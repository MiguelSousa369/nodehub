<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nodehub</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --texto: #1c2430; --suave: #5f6b7a; --linha: #e2e6eb;
    --acento: #2f6fed; --acento-texto: #ffffff; --ok: #1f9d55; --off: #9aa4b1; --aviso: #c27c0e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1a2029; --texto: #e6eaf0; --suave: #95a1b0; --linha: #2a323e;
      --acento: #5b8ef5; --acento-texto: #0d1117; --ok: #3ccf7e; --off: #5c6672; --aviso: #e0a33a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto);
         font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           padding: 18px 24px; border-bottom: 1px solid var(--linha); background: var(--card); }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--acento); }
  .resumo { color: var(--suave); font-size: 14px; }
  .espaco { flex: 1; }
  input[type=search] { padding: 8px 12px; border: 1px solid var(--linha); border-radius: 8px;
                       background: var(--bg); color: var(--texto); font: inherit; min-width: 220px; }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .cliente { margin-bottom: 26px; }
  .cliente h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .6px;
                color: var(--suave); margin: 0 0 10px; }
  .grelha { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .maq { background: var(--card); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px;
         display: flex; flex-direction: column; gap: 6px; }
  .topo { display: flex; align-items: center; gap: 8px; }
  .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .ponto.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .nome { font-weight: 600; font-size: 16px; }
  .det { color: var(--suave); font-size: 13px; }
  .aviso { color: var(--aviso); font-size: 13px; }
  .botoes { display: flex; gap: 8px; margin-top: 6px; }
  .btn { flex: 1; text-align: center; padding: 7px 10px; border-radius: 8px; font: inherit; font-size: 14px;
         cursor: pointer; text-decoration: none; border: 1px solid var(--linha); background: var(--bg); color: var(--texto); }
  .btn.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); font-weight: 600; }
  .btn[aria-disabled=true] { opacity: .45; pointer-events: none; }
  .vazio, .erro { color: var(--suave); padding: 30px 0; text-align: center; }
  .erro { color: var(--aviso); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--texto);
           color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; }
  .toast.ver { opacity: 1; }
  @media (max-width: 600px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    input[type=search] { min-width: 0; width: 100%; }
    .grelha { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>node<span>hub</span></h1>
  <div class="resumo" id="resumo">a carregar…</div>
  <div class="espaco"></div>
  <input type="search" id="filtro" placeholder="Filtrar cliente ou máquina">
</header>
<main id="lista"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let dados = [];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function quando(iso) {
  if (!iso) return "";
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  if (min < 60) return `há ${min} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  return `há ${Math.round(min / 1440)} dias`;
}

function textoClaude(m) {
  return `Helpdesk: cliente ${m.cliente}, máquina ${m.host} (${m.ip || "?"}, utilizador ${m.utilizador}). ` +
         `Inicia a sessão como indicado no CLAUDE.md e depois pergunta-me qual é o problema.`;
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("ver");
  setTimeout(() => t.classList.remove("ver"), 1800);
}

async function copiar(host) {
  const m = dados.find(x => x.host === host);
  try { await navigator.clipboard.writeText(textoClaude(m)); toast("Copiado. Cola no Claude Code."); }
  catch { toast("Não foi possível copiar."); }
}

function cartao(m) {
  const estado = m.online ? "online" : (m.na_tailnet ? `offline ${quando(m.ultimo_contacto)}` : "não encontrada na tailnet");
  const pode = m.configurada;
  const avisos = [];
  if (!m.configurada) avisos.push("Não configurada em maquinas.json");
  return `
  <div class="maq">
    <div class="topo"><span class="ponto ${m.online ? "on" : ""}"></span><span class="nome">${esc(m.host)}</span></div>
    <div class="det">${esc(estado)}${m.ip ? " · " + esc(m.ip) : ""}${m.utilizador ? " · " + esc(m.utilizador) : ""}</div>
    ${m.notas ? `<div class="det">${esc(m.notas)}</div>` : ""}
    ${avisos.map(a => `<div class="aviso">${esc(a)}</div>`).join("")}
    <div class="botoes">
      <a class="btn prim" href="nodehub://open?host=${encodeURIComponent(m.host)}" aria-disabled="${!pode}">Abrir no Claude</a>
      <button class="btn" data-copiar="${esc(m.host)}" ${pode ? "" : "disabled"}>Copiar</button>
    </div>
  </div>`;
}

function desenhar() {
  const f = $("filtro").value.trim().toLowerCase();
  const vis = dados.filter(m => !f || m.host.toLowerCase().includes(f) || m.cliente.toLowerCase().includes(f));
  const grupos = {};
  vis.forEach(m => (grupos[m.cliente] ??= []).push(m));
  const nomes = Object.keys(grupos);
  $("lista").innerHTML = nomes.length
    ? nomes.map(c => `<section class="cliente"><h2>${esc(c)}</h2><div class="grelha">${grupos[c].map(cartao).join("")}</div></section>`).join("")
    : `<div class="vazio">Nenhuma máquina.</div>`;
  const on = dados.filter(m => m.online).length;
  const clientes = new Set(dados.map(m => m.cliente)).size;
  $("resumo").textContent = `${clientes} clientes · ${dados.length} máquinas · ${on} online`;
}

async function carregar() {
  try {
    const r = await fetch("/api/maquinas");
    const j = await r.json();
    dados = j.maquinas || [];
    desenhar();
    if (j.erro) $("lista").insertAdjacentHTML("afterbegin", `<div class="erro">${esc(j.erro)}</div>`);
  } catch (e) {
    $("lista").innerHTML = `<div class="erro">Erro a carregar: ${esc(e.message)}</div>`;
  }
}

$("filtro").addEventListener("input", desenhar);
$("lista").addEventListener("click", (e) => {
  const b = e.target.closest("[data-copiar]");
  if (b) copiar(b.dataset.copiar);
});
carregar();
setInterval(carregar, 30000);
</script>
</body>
</html>
